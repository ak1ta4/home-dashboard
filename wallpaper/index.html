<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home / System 01</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #off {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    font-family: "Space Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #555;
  }
  #off b { color: #E8E8E8; font-weight: 400; }
  #off .rec { width: 8px; height: 8px; border-radius: 50%; background: #D71921; }
</style>
</head>
<body>
  <div id="off"><span class="rec"></span><b>Agent offline</b><span>Start server.py · retrying every 5 s</span></div>
<script>
  // Wallpaper Engine shell. Once the local agent answers, the wallpaper navigates
  // straight to the dashboard it serves (no iframe: Wallpaper Engine's CEF crashes
  // on a cross-origin frame). The dashboard then hooks Wallpaper Engine's audio API itself.
  const AGENT = 'http://127.0.0.1:47800';

  async function check() {
    try {
      await fetch(AGENT + '/api/stats', { mode: 'no-cors', cache: 'no-store' }); // resolves only if the agent answers
      location.replace(AGENT + '/?mode=wallpaper');
    } catch {
      setTimeout(check, 5000);
    }
  }
  check();
</script>
</body>
</html>
